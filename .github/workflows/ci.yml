name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than apt-installed: Ubuntu ships shellcheck 0.9.0, whose
      # reachability analysis floods the generated docopt parser with SC2317
      # false positives. Pinning keeps CI and local runs in agreement.
      - name: Install shellcheck
        run: |
          version=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$version/shellcheck-v$version.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-v$version/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck
        run: make lint

      # The argument parsers are generated from each command's DOC string. A
      # stale DOC is caught at runtime (exit 70), but a hand-edited parser with
      # an untouched DOC is not, so compare against a freshly generated parser.
      - name: Install docopt-sh
        run: pipx install docopt-sh==2.0.3

      - name: Parser freshness
        run: make parser-freshness

      # The command reference in docs/extension.md is generated from the same
      # DOC strings. A hand-edited option list is exactly the kind of drift
      # nobody notices until someone follows the docs and it does not work.
      - name: Command reference freshness
        run: make docs-freshness

  # The Go port. Separate job so a Go failure is distinguishable at a glance
  # from a bash one, and so the matrix below stays about shell versions.
  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          # go-c8y v2 requires 1.25; go.mod pins the language version.
          go-version: '1.25'
          cache: true

      - name: gofmt and go vet
        run: make go-lint

      - name: Build
        run: make go-build

      # Includes the differential test, which runs the bash implementation and
      # the Go one against the same fixture and diffs the artefacts and stderr.
      # jq is what the bash side needs; bash is already present on both runners.
      - name: Install jq
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y jq
          else
            brew list jq >/dev/null 2>&1 || brew install jq
          fi

      - name: Test
        run: make go-test

      # Cross-compiles every platform a release covers and packs the archives.
      # Nothing is uploaded - this only answers whether `make dist` still works,
      # which otherwise nobody finds out until a tag is pushed.
      - name: Release archives build
        if: runner.os == 'Linux'
        run: make dist VERSION=0.0.0-ci

  # The deployable artefact: cumulocity.json plus the image tarball, zipped the
  # way the platform wants it. Built on every push so a broken Dockerfile or an
  # invalid manifest is caught here rather than at upload time, and uploaded as a
  # workflow artifact so a deployable zip exists for any commit.
  microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `make service-package` derives the version from the newest v-tag, so
          # a shallow clone without tags would silently produce a snapshot.
          fetch-depth: 0

      # The runner is amd64 already, so no emulation is needed here - the
      # --platform pin in the Dockerfile just becomes a no-op.
      - name: Build the package
        run: make service-package

      - name: Show what will be deployed
        run: |
          cd build
          unzip -o -d inspect ./*.zip >/dev/null
          echo "manifest:"
          cat inspect/cumulocity.json
          echo
          ls -lh inspect/image.tar

      # The manifest is what the platform validates first, so validate it here.
      # A malformed one fails the upload with a message that does not say which
      # field, so this check is worth the four lines.
      - name: Check the manifest
        run: |
          python3 - <<'PY'
          import json, re, sys
          manifest = json.load(open("build/cumulocity.json"))
          problems = []
          if manifest.get("isolation") != "MULTI_TENANT":
              problems.append("isolation must be MULTI_TENANT")
          if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$", manifest.get("version", "")):
              problems.append(f"version {manifest.get('version')!r} is not SemVer")
          if len(manifest.get("name", "")) > 23:
              problems.append("name must be at most 23 characters")
          if not manifest.get("requiredRoles"):
              problems.append("requiredRoles is empty, so the service users could read nothing")
          for probe in ("livenessProbe", "readinessProbe"):
              if manifest.get(probe, {}).get("httpGet", {}).get("path") != "/health":
                  problems.append(f"{probe} must probe /health")
          # Without this the API documentation application does not know the
          # service has a spec, however well the spec is served.
          spec = manifest.get("openApiSpec")
          if not spec:
              problems.append("openApiSpec is missing, so the API documentation app will not list it")
          elif isinstance(spec, str) and spec.startswith("/"):
              problems.append(f"openApiSpec {spec!r} must be relative to /service/<contextPath>/")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print("manifest ok:", manifest["name"], manifest["version"])
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: microservice-${{ github.sha }}
          path: build/*.zip
          if-no-files-found: error
          retention-days: 30

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu gives bash 5, macOS gives bash 3.2 - the oldest shell these
        # commands must run on, and where arrays and local scoping can bite.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Show shell versions
        run: |
          echo "PATH bash:  $(bash --version | head -1)"
          echo "/bin/bash:  $(/bin/bash --version | head -1)"

      # bats -j needs GNU parallel; without it the suite runs sequentially and
      # takes minutes rather than seconds.
      - name: Install GNU parallel
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y parallel
          else
            brew install parallel
          fi

      - name: Run tests
        run: make test JOBS="$(getconf _NPROCESSORS_ONLN)"

  # Runs the suite through /bin/bash explicitly rather than trusting the
  # shebang, so bash 3.2 coverage cannot be lost if a newer bash appears
  # earlier on PATH in the runner image.
  test-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assert /bin/bash really is 3.2
        run: |
          version=$(/bin/bash -c 'echo $BASH_VERSION')
          echo "/bin/bash is $version"
          case "$version" in
            3.2*) echo "bash 3.2 coverage confirmed" ;;
            *) echo "expected bash 3.2 at /bin/bash, got $version" >&2; exit 1 ;;
          esac

      # bats -j needs GNU parallel; without it the suite runs sequentially and
      # takes minutes rather than seconds.
      - name: Install GNU parallel
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y parallel
          else
            brew install parallel
          fi

      - name: Run tests on bash 3.2
        run: make test-bash3 JOBS="$(getconf _NPROCESSORS_ONLN)"
