name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than apt-installed: Ubuntu ships shellcheck 0.9.0. Pinning
      # keeps CI and local runs in agreement.
      - name: Install shellcheck
        run: |
          version=0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$version/shellcheck-v$version.linux.x86_64.tar.xz" \
            | tar -xJ
          sudo install "shellcheck-v$version/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: shellcheck
        run: make lint

  go:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          # go-c8y v2 requires 1.25; go.mod pins the language version.
          go-version: '1.25'
          cache: true

      - name: gofmt and go vet
        run: make go-lint

      - name: Build
        run: make go-build

      - name: Test
        run: make go-test

      # The command reference in docs/cli.md is generated from the binary's
      # help. A hand-edited option list is exactly the kind of drift nobody
      # notices until someone follows the docs and it does not work.
      - name: Command reference is current
        if: runner.os == 'Linux'
        run: make docs-freshness

      # Cross-compiles every platform a release covers and packs the archives.
      # Nothing is uploaded - this only answers whether `make dist` still works,
      # which otherwise nobody finds out until a tag is pushed.
      - name: Release archives build
        if: runner.os == 'Linux'
        run: make dist VERSION=0.0.0-ci

  # The user interface plugin. The only job that needs Node, and the only one
  # that installs most of a gigabyte of Angular to do its work.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # For the same reason as the microservice job: the tags are what tell a
          # release build from a snapshot of one.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          # The 1024 Web SDK needs Angular 21, which needs Node 20.19+ or newer.
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install
        run: npm --prefix ui ci --no-audit --no-fund

      # The types the UI codes against come from the same OpenAPI document the Go
      # tests keep true to the handlers. Stale generated types mean the UI and the
      # API disagree, which is a build failure rather than a runtime surprise.
      - name: Generated types are current
        run: make ui-types-freshness

      - name: Typecheck
        run: make ui-typecheck

      - name: Test
        run: make ui-test

      # Same as the microservice: the default is a snapshot of the version being
      # developed, not a pinned placeholder.
      - name: Build the plugin
        run: make ui-package

      - uses: actions/upload-artifact@v7
        with:
          name: ui-${{ github.sha }}
          path: build/devicemigration-ui-*.zip
          if-no-files-found: error
          retention-days: 30

  # The deployable artefact: cumulocity.json plus the image tarball, zipped the
  # way the platform wants it. Built on every push so a broken Dockerfile or an
  # invalid manifest is caught here rather than at upload time, and uploaded as a
  # workflow artifact so a deployable zip exists for any commit.
  microservice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is derived from ./VERSION and from git, and the tags are
          # what tell a release build from a snapshot. A shallow clone has none,
          # and would label a tagged commit as a snapshot of it.
          fetch-depth: 0

      # The runner is amd64 already, so no emulation is needed here - the
      # --platform pin in the Dockerfile just becomes a no-op.
      #
      # No version is passed: the default is a snapshot of the version being
      # developed, which is what a package built from a branch is. The commit
      # this came from is the run's own, and the artifact below is named after it.
      - name: Build the package
        run: make service-package

      - name: Show what will be deployed
        run: |
          cd build
          unzip -o -d inspect ./*.zip >/dev/null
          echo "manifest:"
          cat inspect/cumulocity.json
          echo
          ls -lh inspect/image.tar

      # The manifest is what the platform validates first, so validate it here.
      # A malformed one fails the upload with a message that does not say which
      # field, so this check is worth the four lines.
      - name: Check the manifest
        run: |
          python3 - <<'PY'
          import json, re, sys
          manifest = json.load(open("build/cumulocity.json"))
          problems = []
          if manifest.get("isolation") != "MULTI_TENANT":
              problems.append("isolation must be MULTI_TENANT")
          if not re.match(r"^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$", manifest.get("version", "")):
              problems.append(f"version {manifest.get('version')!r} is not SemVer")
          if len(manifest.get("name", "")) > 23:
              problems.append("name must be at most 23 characters")
          if not manifest.get("requiredRoles"):
              problems.append("requiredRoles is empty, so the service users could read nothing")
          for probe in ("livenessProbe", "readinessProbe"):
              if manifest.get(probe, {}).get("httpGet", {}).get("path") != "/health":
                  problems.append(f"{probe} must probe /health")
          # Without this the API documentation application does not know the
          # service has a spec, however well the spec is served.
          for setting in manifest.get("settings", []):
              if not setting.get("defaultValue"):
                  problems.append(f"setting {setting.get('key')!r} declares no default value")
          spec = manifest.get("openApiSpec")
          if not spec:
              problems.append("openApiSpec is missing, so the API documentation app will not list it")
          elif isinstance(spec, str) and spec.startswith("/"):
              problems.append(f"openApiSpec {spec!r} must be relative to /service/<contextPath>/")
          if problems:
              print("\n".join(problems)); sys.exit(1)
          print("manifest ok:", manifest["name"], manifest["version"])
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: microservice-${{ github.sha }}
          path: build/*.zip
          if-no-files-found: error
          retention-days: 30
