openapi: 3.1.0

info:
  title: Device migration
  version: 0.1.0
  summary: Migrates a device hierarchy from one Cumulocity tenant to another.
  description: |
    The migration engine of the c8y-devicemigration tool, running inside
    Cumulocity as a multi-tenant microservice.

    It is deployed on a parent tenant and subscribed to the tenants it migrates
    between, so the platform provides a service user for each and no session file
    or personal credential is involved.

    Two things shape this API and are worth knowing before reading it:

    - A migration is a job, not a request. The platform caps a request at fifteen
      minutes and a hierarchy with data regularly takes longer, so
      `POST /migrations` answers 202 with a job id and the work continues
      afterwards. One migration runs at a time.
    - Only users of the tenant the microservice is deployed on may migrate, and
      only those holding `ROLE_DEVICE_MIGRATION_ADMIN`. A subtenant administrator
      is refused even with the role: migrating writes into a second tenant, and
      rights in the source say nothing about the target.
  license:
    name: Apache-2.0
  contact:
    name: c8y-devicemigration
    url: https://github.com/Cumulocity-IoT/c8y-devicemigration

servers:
  - url: /service/devicemigration
    description: The microservice as the platform exposes it.

security:
  - basicAuth: []
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: migrations
    description: Starting, following and stopping migrations.
  - name: tenants
    description: What this microservice can act on.
  - name: monitoring
    description: What the platform's probes and operators use. No credentials needed.
  - name: remote-targets
    description: Certificate connections to tenants this instance is not subscribed to.

paths:
  /health:
    get:
      tags: [monitoring]
      summary: Liveness and readiness
      description: |
        Probed by the platform, which sends no credentials, so this endpoint is
        the one place that answers without them.
      security: []
      operationId: getHealth
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: UP
              example: {status: UP}

  /prometheus:
    get:
      tags: [monitoring]
      summary: Metrics
      security: []
      operationId: getMetrics
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [monitoring]
      summary: This document
      description: |
        The deployed instance's own description, so what a running version
        accepts can be read from it rather than looked up elsewhere.
      security: []
      operationId: getOpenAPI
      responses:
        "200":
          description: This document.
          content:
            application/yaml:
              schema:
                type: string

  /api-json:
    get:
      tags: [monitoring]
      summary: This document, as JSON
      description: |
        The same document as `/openapi.yaml`, converted to JSON.

        This is the path the manifest's `openApiSpec` names, and what the
        platform's API documentation application reads. It fetches with the
        browser's own session, so like the probes it answers without this
        service's own authorization check.
      security: []
      operationId: getOpenAPIJSON
      responses:
        "200":
          description: This document, as JSON.
          content:
            application/json:
              schema:
                type: object
        "500":
          description: The document could not be converted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tenants:
    get:
      tags: [tenants]
      summary: The tenants this microservice can act on
      description: |
        Every tenant currently subscribed to this application, and the tenant the
        microservice is deployed on. A tenant that is not listed cannot be a
        source or a target: subscribe it first.
      operationId: listTenants
      responses:
        "200":
          description: The subscribed tenants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /preflight:
    post:
      tags: [tenants]
      summary: Check that a migration between two tenants is possible
      description: |
        Answers whether this service could migrate between these two tenants,
        without reading or writing a single device - which is why it takes no
        `rootId`.

        It resolves both tenants in the subscription list, refuses a source and
        target that are the same tenant, and then proves each side's service user
        by asking the platform which tenant it belongs to. Run it after
        subscribing a tenant, and before a migration whose credentials have never
        been used.
      operationId: preflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightRequest"
      responses:
        "200":
          description: Both tenants resolve and both service users work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /estimates:
    post:
      tags: [tenants]
      summary: How much a migration would move
      description: |
        Walks the hierarchy and counts what a migration would carry, without
        creating anything. The answer holds the object and identity counts, the
        record counts per kind, the busiest single device per kind - the limits
        are per device, so a hierarchy well under the total can still be refused
        - and whatever limits it would breach.

        The fields are a migration's own, and they are resolved the same way,
        including the configured default window. An estimate therefore describes
        the run that follows it rather than a similar one.

        Synchronous: a hierarchy walk plus one count per object per kind is
        seconds even at the widest the limits allow. It creates nothing, so a
        caller that changes its mind may simply abandon the request.
      operationId: estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: What that migration would move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /tenants/{tenant}/inventory:
    get:
      tags: [tenants]
      summary: Find something to migrate
      description: |
        Reads a subscribed tenant's inventory on the caller's behalf. A browser
        session belongs to one tenant and the hierarchy being migrated is in
        another, so without this there is no way to offer a choice.

        Only devices, groups and assets are offered - the same three fragments
        the platform's own inventory search looks for - so dashboards, smart
        rules and this service's job records are never returned as something to
        migrate.

        `text` matches on name. `onlyRoots` keeps objects that nothing holds as a
        child, which is the top of a hierarchy; it is resolved from the objects'
        parents, so a page of roots is a page of the inventory with the children
        taken out and can hold fewer objects than `pageSize`. Use `more` rather
        than the number of objects to decide whether to ask for another page.
        Reads only.
      operationId: listInventory
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: text
          in: query
          description: Match objects whose name contains this.
          schema:
            type: string
        - name: onlyRoots
          in: query
          description: >-
            Keep only objects that are nobody's child. Costs the objects' parents
            on the way, and returns fewer objects than `pageSize`.
          schema:
            type: boolean
        - name: pageSize
          in: query
          description: Objects per page, at most 200.
          schema:
            type: integer
            default: 20
        - name: currentPage
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: A page of objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /tenants/{tenant}/inventory/{id}:
    get:
      tags: [tenants]
      summary: One object, and what is under it
      description: |
        Confirms a choice, and answers whether an id exists at all — rather than
        a wrong id being discovered when the migration runs, minutes later. Child
        counts come from the platform, so a group holding four hundred devices
        costs the same to look at as one holding two.
      operationId: getInventoryObject
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ObjectID"
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryObject"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /tenants/{tenant}/inventory/{id}/children:
    get:
      tags: [tenants]
      summary: What is directly under one object
      description: |
        The drill-down, over the same three relationship kinds a migration can
        follow and named the same way, so a picker and a migration request speak
        one vocabulary.
      operationId: listInventoryChildren
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ObjectID"
        - name: childTypes
          in: query
          description: |
            Comma separated, from `asset`, `device` and `addition`. Omitted means
            the migration default, `asset,device`.
          schema:
            type: string
            default: asset,device
      responses:
        "200":
          description: The children, each saying which relationship it came from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /tenants/{tenant}/platform/inventory/managedObjects:
    get:
      tags: [tenants]
      summary: The platform's inventory listing, for one tenant
      description: |
        The platform's own `GET /inventory/managedObjects`, performed in a
        subscribed tenant with that tenant's service user, and answered with
        exactly what the platform said — envelope, `statistics` and ordering
        included.

        This exists so the platform's own components can browse a tenant the
        browser has no session in. A Cumulocity client given
        `/service/devicemigration/tenants/{tenant}/platform` as its base URL
        behaves as though it were signed in to that tenant, which is what lets
        the asset selector search, page and expand a group here without any of
        that being reimplemented.

        The whole query string is forwarded, so every filter, page and ordering
        the platform understands works. Reads only, and only the inventory: three
        routes exist and there is no wildcard, so anything else is a 404.
      operationId: proxyInventoryList
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: The platform's answer, unchanged apart from its links.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  A Cumulocity managed object collection. Not described further
                  here on purpose: it is the platform's shape, and restating it
                  would be a second definition to keep in step.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /tenants/{tenant}/platform/inventory/managedObjects/{id}:
    get:
      tags: [tenants]
      summary: The platform's managed object read, for one tenant
      description: |
        The platform's own `GET /inventory/managedObjects/{id}` in a subscribed
        tenant. Query parameters are forwarded, so `withParents` and
        `withChildren` behave as they do on the platform.
      operationId: proxyInventoryObject
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ObjectID"
      responses:
        "200":
          description: The platform's answer, unchanged apart from its links.
          content:
            application/json:
              schema:
                type: object
                description: A Cumulocity managed object.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /tenants/{tenant}/platform/inventory/managedObjects/{id}/{relationship}:
    get:
      tags: [tenants]
      summary: One of an object's reference collections, for one tenant
      description: |
        The platform's own reference collections: `childAssets`, `childDevices`,
        `childAdditions`, `assetParents`, `deviceParents` and
        `additionParents`. Expanding a group is one of these reads, which is
        most of what choosing a root consists of.

        Any other value is a 400 rather than a forwarded request, so a path
        parameter cannot become a way to reach the rest of the platform API.
      operationId: proxyInventoryReferences
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ObjectID"
        - name: relationship
          in: path
          required: true
          description: Which collection to read.
          schema:
            type: string
            enum:
              - childAssets
              - childDevices
              - childAdditions
              - assetParents
              - deviceParents
              - additionParents
      responses:
        "200":
          description: The platform's answer, unchanged apart from its links.
          content:
            application/json:
              schema:
                type: object
                description: A Cumulocity managed object reference collection.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /remote-targets:
    post:
      tags: [remote-targets]
      summary: Establish a certificate connection to an unsubscribed target
      description: |
        Mints a throwaway certificate authority and a client leaf for a target
        tenant this instance is not subscribed to - a different parent, or a
        different system. Returns the **public** CA to register on that target as
        trusted with auto-registration; the private leaf and key stay in memory
        here and are never returned or recorded. A migration then references the
        returned `id` as `remoteTargetId`.

        Reachable-until-restart: the connection lives in memory, so a container
        restart forgets it and it must be established again.
      operationId: createRemoteTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteTargetRequest"
      responses:
        "201":
          description: The connection, with the CA to register.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteTargetEstablished"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    get:
      tags: [remote-targets]
      summary: The established remote targets
      description: Without their certificates - the secret material is never listed.
      operationId: listRemoteTargets
      responses:
        "200":
          description: The remote targets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  remoteTargets:
                    type: array
                    items:
                      $ref: "#/components/schemas/RemoteTargetView"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /remote-targets/{id}:
    delete:
      tags: [remote-targets]
      summary: Discard a remote target
      description: Forgets the certificate before it lapses.
      operationId: deleteRemoteTarget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Discarded.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /migrations:
    post:
      tags: [migrations]
      summary: Start a migration
      description: |
        Validates the request, records the job in the owner tenant, and queues
        it. Everything that can be checked without touching a tenant is checked
        before this returns, so a bad root id or an unsubscribed tenant is a 400
        rather than a job that fails a minute later.

        Migrations always run incrementally - the export is staged one device's
        data at a time - because that is what bounds the container's ephemeral
        disk. For the same reason there is no way to ignore the export limits or
        to keep the staging directory.
      operationId: createMigration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationRequest"
      responses:
        "202":
          description: |
            Accepted and queued. The body is the job as it was accepted, and the
            Location header points at it.
          headers:
            Location:
              description: Where this job's status can be read.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/Busy"}

    get:
      tags: [migrations]
      summary: Every migration this service has run
      description: |
        Read from the job records in the owner tenant, newest first, so the
        listing survives the container being replaced.
      operationId: listMigrations
      responses:
        "200":
          description: The jobs on record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /migrations/{id}:
    get:
      tags: [migrations]
      summary: One migration
      description: |
        The running job is answered from memory and any other from its record, so
        a running job's progress is as current as the engine's last line rather
        than as its last record update.
      operationId: getMigration
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

    delete:
      tags: [migrations]
      summary: Forget a migration, and the undos of it
      description: |
        Deletes this service's **record** of a migration, and the records of
        every revert of that run. It deletes nothing in either tenant: whatever
        the migration created stays where it is, still carrying its run marker,
        which afterwards is the only way left to find those objects - so undoing
        the migration from this service is no longer possible once its record is
        gone.

        The undos go with it because a revert record names its migration by run
        id and nothing else: left behind, it is a row that can say only *undo of
        20260101T…*. The response lists every job that was removed.

        A job that has not finished is a **409**: its record is still being
        written. Cancel it, let it settle, and ask again.

        The same thing happens on a schedule when `records.retention.days` is
        set - see the settings - which prunes finished records by age.
      operationId: deleteMigration
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The records that were deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /migrations/{id}/cancel:
    post:
      tags: [migrations]
      summary: Ask a running migration to stop
      description: |
        The job stops at its next platform call, so this returns before it has.

        A job that is not running here is not an error. Either it finished
        between the screen being drawn and the button being pressed, or its
        container was replaced and the record was left saying `RUNNING` - and in
        the second case this settles that record as `INTERRUPTED` rather than
        refusing. Asking to cancel a job that is already over is a **409**.

        A cancelled job reports `countsVerified: false`, and that is not a
        formality: the engine has no cancellation checks, so a cancelled import
        counts the records it never sent as failures. Check the target tenant by
        run id before retrying.
      operationId: cancelMigration
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: |
            The cancellation has been asked for. Also the answer when the job was
            not running here after all and its record has been settled instead -
            see the description above.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /migrations/{id}/credentials:
    post:
      tags: [migrations]
      summary: Collect the device credentials a migration issued, once
      description: |
        Returns the credentials file for a migration run with
        `provisionCredentials`, as `text/csv` with the columns `EXTERNAL_ID`,
        `TENANT`, `USERNAME`, `PASSWORD` - the same file the command line writes.

        **A POST, because it changes state.** The passwords are destroyed as they
        are served, so this is not a read however much it looks like a download.
        A browser session must send `X-XSRF-TOKEN` with it, like any other write.

        **Handed over only to the caller who started the migration.** Holding
        `ROLE_DEVICE_MIGRATION_ADMIN` is what lets somebody start one; it is
        deliberately not enough to take the passwords of one they did not.
        Anybody else gets a **403**, and `credentialsAvailable` is reported as
        false to them so no screen offers a download that would be refused.

        **Handed over exactly once.** The passwords are held in this service's
        memory and dropped as they are served, so a second call is a **410**. That
        is deliberate: it makes "were these collected?" an answerable question,
        and it bounds how long a list of working device passwords sits in a
        long-lived process. They are never written to the job record, which is an
        ordinary managed object any administrator of the owner tenant can read.

        A **410** therefore means one of three things, and this endpoint cannot
        tell them apart: they have already been collected, the container was
        replaced since the migration ran, or the migration issued none. The way
        back in every case is to register the devices again, which **rotates**
        their passwords and invalidates any file handed out earlier.

        Getting the file onto the devices is the operator's own channel - a
        configuration push through the source tenant while they are still
        connected to it, a field technician, or existing device-management
        tooling. This service does not deliver credentials to devices.
      operationId: collectMigrationCredentials
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: |
            The credentials file. This is the only copy, and asking again returns
            410.
          content:
            text/csv:
              schema:
                type: string
              example: |
                EXTERNAL_ID,TENANT,USERNAME,PASSWORD
                PLANT-BERLIN-01,t22222,device_PLANT-BERLIN-01,aB3xY7zQ2tR5wK8
                LINE-A-SN,t22222,device_LINE-A-SN,7mQ4bW9nH2xL6dK
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: |
            The caller may not collect these: they did not start this migration,
            or its record does not say who did.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "404": {$ref: "#/components/responses/NotFound"}
        "410":
          description: |
            There are no credentials to hand over: already collected, lost to a
            restart, or none were issued. Register the devices again to issue new
            ones, which rotates their passwords.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /devices/self/migration:
    post:
      tags: [migrations]
      summary: What a migrated device should do, answered to the device itself
      description: |
        A migrated device asks where to reconnect and who it now is, and gets both
        in one answer. Called **by the device**, with the credentials it already
        has for its own tenant.

        This is the only endpoint that accepts a caller from outside the tenant
        this service is deployed on, and the exception is deliberately narrow:
        device users, one endpoint, **no parameters**. The device's identity comes
        from the platform, not from the request, so there is nothing in the call to
        tamper with and no device id to substitute. The external id is read out of
        the authenticated username.

        A migration is still started by a person through `POST /migrations`. This
        endpoint neither starts nor authorises one; it reports the result of one
        that already succeeded.

        **The password is handed over once.** It is generated when the device asks
        and stored nowhere, so a second call answers with the endpoint and
        `alreadyIssued: true` rather than a new password — a device retrying a
        failed move needs to know where to go on every attempt, but a device that
        cannot keep its credential must not be allowed to rotate it forever. An
        administrator re-issues by removing the
        `c8y_DeviceMigrationCredentialsIssued` fragment from the device's managed
        object in the target tenant.

        That rule bounds **how often** a credential is issued, not to whom. The
        fragment lives on an object owned by the device user it was issued for, so
        anything able to write that object can clear it — which is what the
        re-issue procedure above is. It is a brake on repetition, not a record that
        a credential was handed over exactly once.

        Two further limits are worth knowing before enabling this for a migration,
        and neither has a mitigation here:

        - **The caller is whoever holds the device user.** `device_` is the
          platform's naming convention, not a reserved namespace. This endpoint
          establishes that the caller holds `device_<externalId>` in a subscribed
          tenant, not that it is the physical device, so a migration that opts into
          this route trusts the source tenant's user administration while
          credentials are outstanding.
        - **A device with no device user of its own cannot use it.** A child device
          behind a gateway authenticates as the gateway; a device registered by
          hand may hold a username of any shape. Such devices are migrated like any
          other and told there is nothing to do, so they arrive without
          credentials.

        "Nothing to do" is a `200` with `migrate: false`, not an error: a device
        asking on a timer should not fill its log with failures.
      operationId: getDeviceSelfMigration
      responses:
        "200":
          description: |
            Where to go, and — the first time — who to be.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeviceMigrationResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403":
          description: |
            The caller is not a device user, or does not hold `ROLE_DEVICE`. A
            person starts a migration through `POST /migrations` instead.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "429":
          description: |
            This caller is asking more often than a device needs to. The answer
            does not change between asks, and the search behind it costs calls in
            other tenants, so a caller in a loop is refused rather than served.

            `Retry-After` carries the number of seconds to wait. A device on an
            ordinary timer — minutes, not seconds — never meets this.
          headers:
            Retry-After:
              description: Seconds to wait before asking again.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /tenants/{tenant}/trusted-certificates:
    get:
      tags: [migrations]
      summary: A tenant's truststore, with what can be moved out of it
      description: |
        The trusted CA certificates of one tenant, each with this service's
        assessment of whether a cutover would attempt it.

        For a certificate fleet the credential is the chain and it never changes:
        the device keeps its key and its certificate, and migrating it means
        making the target tenant trust that chain instead. This is where the
        certificate to move is chosen.

        Two entries are refused rather than offered, and both are things a cutover
        would otherwise discover *after* the source had lost the certificate:
        the tenant's **own** certificate authority, which cannot be moved at all —
        a fleet enrolled against it needs re-enrolling, a different mechanism — and
        an **expired** certificate, which would produce a cutover that cannot work
        after an outage that cannot be avoided.

        The `warning` is not decoration. Every device whose certificate chains to
        a CA moves when that CA moves, including devices no migration covered, and
        the platform records nothing about which devices a certificate
        authenticates — so this service cannot count them and says so rather than
        guessing.
      operationId: listTrustedCertificates
      parameters:
        - name: tenant
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The truststore.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrustedCertificatesResponse"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /certificate-cutovers:
    post:
      tags: [migrations]
      summary: Move a trusted certificate from one tenant to another
      description: |
        Removes a trusted CA from the source tenant and creates it in the target,
        so the devices chained to it are accepted there instead.

        **The certificate arrives as it stood.** Its status is carried across
        unchanged, and auto-registration defaults to whatever the source tenant
        had — both decide which devices this CA may bring into a tenant, so
        neither is decided here. Pass `autoRegistrationEnabled` to choose
        deliberately; the response says plainly when the result is false, because
        arriving devices are then refused.

        **There is an outage in this operation and no way to flip it back.** A
        fingerprint can exist in only one tenant per platform instance, and
        disabling it in the source does *not* free it — it is held by existence,
        not by status. So this is delete-then-create, and between the two calls
        every device chained to that certificate can reach neither tenant.
        Recovery from a refused create is re-creating in the source, which this
        endpoint attempts and reports on, not reversing a flag.

        For that reason it is **synchronous rather than a job**: a failure has to
        reach the person who asked while they are still there to act on it.
        Everything checkable is checked before the source loses anything — the
        certificate exists and is movable, its PEM is readable, and the target
        does not already have it. A **disabled** certificate is refused: it
        authenticates nobody, so there is no fleet to move and an outage would buy
        nothing — and it is disabled because somebody disabled it, which a
        migration is not the place to undo.

        No proof of possession is demanded by the platform, so the **public**
        certificate is all that crosses and nobody needs the CA's private key.

        **The fleet moves by itself, and nothing has to change on any device.**
        Within one platform instance a connection is routed by the certificate it
        presents rather than by the hostname it dials — measured, not assumed —
        so a device still configured with the source host arrives in the target.
        Devices that are connected move when they reconnect; devices that are
        offline move when they return. Both tenants are on this instance by
        construction, since a tenant elsewhere cannot be subscribed to this
        service.
      operationId: cutOverCertificate
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TrustAnchorCutoverRequest"}
      responses:
        "200":
          description: |
            The certificate has moved. Check `autoRegistrationEnabled`: it is read
            back from the target rather than assumed, and a target that accepted
            the certificate while dropping that flag would refuse every arriving
            device.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TrustAnchorCutoverResponse"}
        "400":
          description: |
            The certificate cannot be moved — the tenant's own CA, an expired one,
            a disabled one, or no readable PEM. Nothing was changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409":
          description: |
            The target already has this certificate, so there is nothing to move.
            Nothing was changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /reverts:
    post:
      tags: [migrations]
      summary: Undo what a migration created
      description: |
        Deletes the objects a run created in the tenant it migrated into.

        A run id is all this needs: every object a migration creates carries a
        marker fragment naming the run, so the engine finds them by asking the
        target tenant rather than by reading a mapping file. Nothing has to have
        survived on disk, which is what makes undoing a run possible from a
        container that has been replaced since.

        `jobId` is the same thing spelled more conveniently - the run id and the
        tenant are both on that job's record. A migration run with `noFlag` has
        no marker and therefore cannot be undone this way; the refusal says so.

        Like a migration this is a job, and it shares the same queue, so a revert
        never runs while a migration is part way through creating what it would
        be deleting.
      operationId: createRevert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequest"
      responses:
        "202":
          description: Accepted and queued.
          headers:
            Location:
              description: Where this job's status can be read.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/Busy"}

    get:
      tags: [migrations]
      summary: Every revert this service has run
      operationId: listReverts
      responses:
        "200":
          description: The reverts on record, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevertsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /reverts/{id}:
    get:
      tags: [migrations]
      summary: One revert
      operationId: getRevert
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

    delete:
      tags: [migrations]
      summary: Forget a revert
      description: |
        Deletes this service's record of one undo and nothing else. Deleting the
        migration it belongs to removes it too, which is the usual way this
        happens; this is for an undo whose migration is no longer on record - a
        revert run from the command line against an aged-out run id.

        Like deleting a migration, this removes bookkeeping only, and a job that
        has not finished is a **409**.
      operationId: deleteRevert
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The records that were deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletionResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /reverts/{id}/cancel:
    post:
      tags: [migrations]
      summary: Ask a running revert to stop
      description: |
        A cancelled revert reports `countsVerified: false`, and here that matters
        more than anywhere else: the engine decides an object is gone by whether
        re-reading it fails, so a cancelled run reports objects as deleted that
        are still there. Run the revert again rather than trusting its numbers -
        deleting what is already gone is reported as absent and costs nothing.
      operationId: cancelRevert
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: |
            The cancellation has been asked for, or the job's record has been
            settled - see cancelMigration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /loggers:
    get:
      tags: [monitoring]
      summary: The log level in force
      description: |
        The Spring Boot actuator shape the platform proxies at
        `/service/{name}/loggers`, so `c8y microservices loggers` works against
        this service.

        Go's structured logging has no logger hierarchy to expose, so there is one
        logger, named `ROOT` as the actuator names its own. Anything else is a
        404 rather than a pretence that it was configured.
      operationId: listLoggers
      responses:
        "200":
          description: The levels available and the logger there is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggersResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /loggers/{name}:
    get:
      tags: [monitoring]
      summary: One logger
      operationId: getLogger
      parameters:
        - $ref: "#/components/parameters/LoggerName"
      responses:
        "200":
          description: That logger's level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggerConfiguration"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

    post:
      tags: [monitoring]
      summary: Change the log level while the service runs
      description: |
        Turning debug output on without redeploying, which otherwise means losing
        whatever was running. A `configuredLevel` of `null`, or an absent one,
        resets to the default - which is what `c8y microservices loggers delete`
        sends.
      operationId: setLogger
      parameters:
        - $ref: "#/components/parameters/LoggerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                configuredLevel:
                  type: [string, "null"]
                  enum: [ERROR, WARN, INFO, DEBUG, TRACE, null]
                  description: |
                    TRACE is accepted and treated as DEBUG, which is the finest
                    level Go's logging has.
              example: {configuredLevel: DEBUG}
      responses:
        "204":
          description: The level was changed.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Credentials must name their tenant, as `tenant/username`. Basic auth
        without a tenant is ambiguous and is refused rather than assumed to mean
        the owner tenant.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The tenant is taken from the token's `ten` claim.
    cookieAuth:
      type: apiKey
      in: cookie
      name: authorization
      description: |
        A browser session, which is what the API documentation application's
        "Try it out" uses. The cookie holds the session token, and the tenant
        comes from its `ten` claim.

        Anything other than a read must also carry the `X-XSRF-TOKEN` header,
        matching the session. A cookie travels with any request a browser can be
        talked into making, so without that header a page visited while logged in
        could start a migration; reads need no such proof. A session with
        two-factor authentication must also send its `tfatoken` header, which is
        forwarded when the caller is verified.

  parameters:
    TenantID:
      name: tenant
      in: path
      required: true
      description: A tenant subscribed to this microservice.
      schema:
        type: string
      example: t87654321

    ObjectID:
      name: id
      in: path
      required: true
      description: A managed object id. An id, not a path.
      schema:
        type: string
      example: "1399229"

    LoggerName:
      name: name
      in: path
      required: true
      description: The logger, of which there is one - `ROOT`.
      schema:
        type: string
      example: ROOT

    JobID:
      name: id
      in: path
      required: true
      description: The job id, as returned when the migration was accepted.
      schema:
        type: string
      example: 20260825T162735Z_c8e249

  schemas:
    TenantsResponse:
      type: object
      properties:
        ownerTenant:
          type: string
          description: |
            The tenant the microservice is deployed on. Job records are written
            here, and only its users may migrate.
        tenants:
          type: array
          description: Every tenant subscribed to this application.
          items:
            $ref: "#/components/schemas/TenantDescription"
      example:
        ownerTenant: t10001
        tenants:
          - {id: t10001, name: Operations, domain: t10001.eu-latest.cumulocity.com}
          - {id: t11111, name: Werk Berlin, domain: t11111.eu-latest.cumulocity.com}

    TenantDescription:
      type: object
      description: |
        A tenant as a person would recognise it. The id is what every other
        endpoint takes; the name and the host are what somebody choosing between
        two tenants reads.

        They come from two places, because the platform keeps them in two: the
        name is the company in tenant management, which only the owner tenant can
        read and only with `ROLE_TENANT_MANAGEMENT_READ`; the host is from each
        tenant's own `currentTenant`, which its service user can always read.
        Either can be absent - a tenant that cannot be described is still listed
        with its id, because that is what a migration needs.
      properties:
        id:
          type: string
        name:
          type: string
          description: The company name, from tenant management.
        domain:
          type: string
          description: The host this tenant is reached at.

    RemoteTargetRequest:
      type: object
      required: [host, tenant]
      properties:
        host:
          type: string
          description: Where the target lives, e.g. t12345.eu-latest.cumulocity.com. Https assumed.
        tenant:
          type: string
          description: The target tenant id, used to reject a same-tenant migration and shown on the job.
      example:
        host: t22222.eu-latest.cumulocity.com
        tenant: t22222

    RemoteTargetView:
      type: object
      description: A remote target without its certificate.
      properties:
        id:
          type: string
        host:
          type: string
        tenant:
          type: string
        subject:
          type: string
          description: The common name of the leaf, which the target auto-registers as a device.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    RemoteTargetEstablished:
      type: object
      description: A newly established remote target and the CA to register on it.
      properties:
        id:
          type: string
        host:
          type: string
        tenant:
          type: string
        subject:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        caCertificate:
          type: string
          description: The public CA certificate to register as trusted on the target.
        instructions:
          type: string
          description: What to do with the CA, in words.

    PreflightRequest:
      type: object
      required: [sourceTenant]
      description: |
        Give exactly one of `targetTenant` (a subscribed tenant) or
        `remoteTargetId` (a target established with `POST /remote-targets`).
      properties:
        sourceTenant:
          type: string
          description: The tenant a migration would read from.
        targetTenant:
          type: string
          description: A subscribed tenant a migration would write to. Must not be the source.
        remoteTargetId:
          type: string
          description: |
            A remote target established with `POST /remote-targets`, for a tenant
            this instance is not subscribed to.
        rootId:
          type: string
          description: |
            The hierarchy a migration would move. Needed only by
            `provisionCredentials`, which is a question about the devices rather
            than about the two tenants.
        childTypes:
          type: string
          description: |
            The migration's own relationship kinds, because which ones are
            followed decides which devices it covers. Give the same value the
            migration will, or `provisionCredentials` answers about a different
            set of devices.
        noChildren:
          type: boolean
          description: The migration's own `noChildren`, for the same reason.
        provisionCredentials:
          type: boolean
          description: |
            Also check whether a device user can be created for each of these
            devices in the target. Requires `rootId`, costs a walk of the
            hierarchy and a lookup per device, and is therefore asked for rather
            than always done. Refused together with `remoteTargetId`, which
            cannot provision credentials at all.
      example:
        sourceTenant: t11111
        targetTenant: t22222

    PreflightResponse:
      type: object
      properties:
        host:
          type: string
          description: The platform both tenants live on.
        source:
          $ref: "#/components/schemas/PreflightSide"
        target:
          $ref: "#/components/schemas/PreflightSide"
        credentialsRefused:
          type: boolean
          description: |
            True when this migration cannot provision credentials, because the
            target tenant already holds an external identity it would have to
            register. Absent unless the request asked.

            The two tenants themselves still checked out: it is this one option
            that is unavailable, and a migration without it can go ahead.
        conflicts:
          type: array
          description: The devices behind `credentialsRefused`, one entry each.
          items:
            $ref: "#/components/schemas/PreflightConflict"

    PreflightConflict:
      type: object
      description: |
        A device to be migrated whose external identity the target tenant
        already holds.
      properties:
        sourceId:
          type: string
          description: The object in the source tenant.
        name:
          type: string
          description: Its name, when it has one.
        externalId:
          type: string
          description: The external identity both tenants hold.
        externalType:
          type: string
          description: That identity's type, for example `c8y_Serial`.
        targetId:
          type: string
          description: The object in the target tenant already carrying it.

    PreflightSide:
      type: object
      properties:
        tenant:
          type: string
          description: The tenant that was asked for.
        reportedTenant:
          type: string
          description: |
            The tenant the platform says the service user belongs to. Proof that
            the credentials work, rather than that they exist.
        serviceUser:
          type: string
          description: The service user this microservice acts as in that tenant.

    MigrationRequest:
      type: object
      required: [sourceTenant, rootId]
      description: |
        The fields are the command line tool's flags, resolved by the same code,
        so values mean here exactly what they mean there. An unknown field is
        refused rather than ignored, so a typo is a 400.

        The target is given as exactly one of `targetTenant` (a subscribed
        tenant) or `remoteTargetId` (a target this instance is not subscribed to,
        established with `POST /remote-targets`).
      properties:
        sourceTenant:
          type: string
          description: The tenant to read from. Must be subscribed to this application.
        targetTenant:
          type: string
          description: A subscribed tenant to write to. Must not be the source.
        remoteTargetId:
          type: string
          description: |
            A remote target established with `POST /remote-targets`. When given,
            `targetTenant` is filled in from it and need not be sent.
        rootId:
          type: string
          description: |
            The id of the root managed object to migrate. An id, not a path: a
            value containing a path separator is refused, because it would end up
            in the names of the files the export writes.
        childTypes:
          type: string
          description: |
            Comma separated child relationship types to follow, from `asset`,
            `device` and `addition`. Omitted means the default.
          default: asset,device
        noChildren:
          type: boolean
          description: Migrate only the root object. Cannot be combined with childTypes.
          default: false
        dataTypes:
          type: string
          description: |
            Comma separated device data to include, from `measurements`, `events`
            and `alarms`, or `all` for every one of them. Omitted means no data.
            `all` cannot be combined with named types.
        dateFrom:
          type: string
          description: |
            Start of the data window, absolute or relative (`-30d`). Measurements
            default to the last 14 days; events and alarms to everything.
        dateTo:
          type: string
          description: End of the data window.
        provisionCredentials:
          type: boolean
          description: |
            Provision a device user for every migrated device, so the devices can
            reconnect to the target tenant.

            The devices are registered **before** the hierarchy is imported, which
            is what makes each object belong to its own device user: bulk
            registration creates the managed object owned by the user it creates
            alongside it, and the import then fills that object in. Registering
            after an import cannot give a device ownership of an object that
            already exists.

            The passwords are never written to the job record. They are held in
            this service's memory and collected **once** from
            `POST /migrations/{id}/credentials`; a restart loses them, and
            re-registering to replace them rotates every password it touches.

            Cannot be combined with `remoteTargetId`: a remote target is reached
            with a device access token, which has no permission to register
            devices.
          default: false
        deviceSelfCredentials:
          type: boolean
          description: |
            Let the migrated devices collect their own credentials from
            `POST /devices/self/migration`, instead of an operator distributing a
            file.

            Two things follow. Each migrated object is created **owned by the
            device user it will authenticate as**, because a device can write its
            own twin only if it owns it — `ROLE_DEVICE` carries writes together
            with ownership and not on its own. And this run becomes
            **collectable**: the device endpoint answers only for migrations that
            asked for it.

            That second part is the point rather than a detail. It makes the reach
            of the one endpoint outside this tenant a decision taken per
            migration, rather than a standing property of every migration this
            service has ever run.

            Cannot be combined with `provisionCredentials`: that issues every
            credential up front and hands you a file, and a device collecting its
            own afterwards would rotate the password already in it. Nor with
            `remoteTargetId`: issuing a credential means registering a device user
            in the target, and a remote target is reached with a device access
            token that cannot do so.
          default: false
        certificateFleet:
          type: boolean
          description: |
            Say that the migrated devices authenticate with **X.509 certificates**,
            so there is no credential to issue at all.

            It still changes the migration, which is why it exists: each object is
            created **owned by the device user its certificate will authenticate
            as**. Without it a certificate device arrives, auto-registers onto its
            migrated twin, and is silently **read-only** on it — `ROLE_DEVICE`
            carries writes only together with ownership. Nothing about that failure
            is visible until somebody notices a fleet that looks migrated and sends
            no data.

            Migrating the objects is only half of such a move. The other half is
            making the target tenant trust the fleet's CA — `POST
            /certificate-cutovers` within one instance, or registering the CA on
            the other instance by hand across two. Until then the devices stay
            where they are.

            Cannot be combined with `provisionCredentials` or
            `deviceSelfCredentials`: a certificate fleet keeps the chain it already
            has and has no password to issue. **Can** be combined with
            `remoteTargetId`, unlike either of those — it creates no user, only an
            owner on objects that token already owns.
          default: false
        noFlag:
          type: boolean
          description: |
            Leave created objects unmarked. The marker fragment is what makes a
            run findable by its run id, so without it the job's mapping is the
            only record of what was created - and that mapping does not outlive
            the container.
          default: false
      example:
        sourceTenant: t11111
        targetTenant: t22222
        rootId: "1399229"
        dataTypes: all
        dateFrom: -30d

    TrustedCertificateView:
      type: object
      description: One trusted certificate, and whether a cutover would attempt it.
      properties:
        fingerprint:
          type: string
          description: |
            The SHA-1 fingerprint, which is how the platform addresses a trusted
            certificate. Not SHA-256.
        name: {type: string}
        status: {type: string}
        subject: {type: string}
        issuer: {type: string}
        notAfter:
          type: string
          description: When it expires. An expired certificate is not movable.
        autoRegistrationEnabled: {type: boolean}
        tenantCertificateAuthority:
          type: boolean
          description: |
            The tenant's own certificate authority. Never movable: a fleet
            enrolled against it needs re-enrolling in the target.
        movable:
          type: boolean
          description: Whether a cutover would attempt this certificate.
        reason:
          type: string
          description: Why not, when `movable` is false.

    TrustedCertificatesResponse:
      type: object
      properties:
        tenant: {type: string}
        certificates:
          type: array
          items: {$ref: "#/components/schemas/TrustedCertificateView"}
        warning:
          type: string
          description: |
            The blast radius, in words rather than a number - the platform records
            nothing about which devices a certificate authenticates.

    TrustAnchorCutoverRequest:
      type: object
      required: [sourceTenant, targetTenant, fingerprint]
      properties:
        sourceTenant:
          type: string
          description: The tenant that trusts the certificate now.
        targetTenant:
          type: string
          description: The tenant that should trust it instead.
        fingerprint:
          type: string
          description: |
            The certificate's SHA-1 fingerprint. A fingerprint rather than a name,
            because names are not unique and this operation has an outage in it.
        autoRegistrationEnabled:
          type: boolean
          description: |
            Whether the target should register a device presenting this chain for
            the first time. **Omit it to carry the source tenant's own setting
            across**, which is the default and almost always what is wanted.

            Give it only to change that deliberately. Which devices a CA may bring
            into a tenant is a decision somebody takes, not a side effect of
            moving the certificate — forcing it on would enable auto-registration,
            with nothing saying so, for a tenant that had trusted a CA *without*
            it.
      example:
        sourceTenant: t11111
        targetTenant: t22222
        fingerprint: f75bd686243e6916c94408e1fa65e34367136077

    TrustAnchorCutoverResponse:
      type: object
      properties:
        fingerprint: {type: string}
        name: {type: string}
        sourceTenant: {type: string}
        targetTenant: {type: string}
        autoRegistrationEnabled:
          type: boolean
          description: |
            What the target says after the move, read back rather than assumed.
            False means a device arriving with no device user of its own is
            refused there — which may be exactly what was asked for, or may be a
            target that did not take the setting with the certificate. `message`
            distinguishes the two.
        warning: {type: string}
        message: {type: string}

    DeviceMigrationResponse:
      type: object
      description: |
        What a migrated device is told: whether to move, where to, and who to be.
      properties:
        migrate:
          type: boolean
          description: |
            False when no succeeded migration carried this device. Everything else
            is then empty and the device should stay where it is.
        host:
          type: string
          description: The hostname to reconnect to.
        tenant:
          type: string
          description: |
            The target tenant. It matters on its own because a basic-auth device
            authenticates as `<tenant>/<username>`.
        username:
          type: string
          description: The device user in the target tenant.
        password:
          type: string
          description: |
            Present only when this call is what issued it. Generated here and
            stored nowhere, so it is never returned twice.
        alreadyIssued:
          type: boolean
          description: |
            True when a credential was handed over for this device before, so this
            call did not mint another one. The endpoint still answers where to go.

            It says a credential was issued for this device, not that this caller
            received it — there is no record of who collected. A device that lost
            its credential and one that never had it see the same answer, and
            `message` says what to do about either.
        runId:
          type: string
          description: The migration that carried this device, for diagnosis.
        message:
          type: string
          description: For a human reading a device's log.
      example:
        migrate: true
        host: t22222.eu-latest.cumulocity.com
        tenant: t22222
        username: device_LINE-A-SN
        password: Zq7#nR4tLm9xW2v
        runId: 20260908T101112Z_ab12cd

    RevertRequest:
      type: object
      description: |
        Either a run id with the tenant to undo it in, or the id of the job that
        created it - in which case both are read from that job's record.
      properties:
        targetTenant:
          type: string
          description: |
            The tenant holding what should be deleted. Required unless jobId
            says which tenant it was.
        runId:
          type: string
          description: |
            The run whose objects should be deleted. Required unless jobId is
            given; if both are given they must agree.
        jobId:
          type: string
          description: The migration to undo, which is where the run id comes from.
        remoteTargetId:
          type: string
          description: |
            The certificate this undo presents, when the migration it undoes
            reached its target with one. Filled in from that migration's record,
            not sent by the caller: it has to be the *same* certificate, because
            a device token may delete only what it owns and the objects are owned
            by the identity that created them.

            An opaque handle. The key it stands for never leaves the service's
            memory, so an undo is possible only while that certificate lives -
            `GET /remote-targets` says until when.
      example:
        jobId: 20260825T162735Z_c8e249

    InventoryObject:
      type: object
      description: As much of a managed object as choosing a root needs.
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        owner:
          type: string
        creationTime:
          type: string
        isDevice:
          type: boolean
          description: Carries the platform's device marker.
        isGroup:
          type: boolean
          description: Carries the platform's group marker.
        children:
          type: object
          additionalProperties:
            type: integer
          description: |
            How many children per relationship kind. Present only where the
            platform was asked to count them, which the single-object read does.
            An absent count is not zero.
        childType:
          type: string
          enum: [asset, device, addition]
          description: The relationship this object was reached by, when it was reached as a child.
      example:
        id: "1399229"
        name: Plant Berlin
        type: c8y_Site
        isDevice: false
        isGroup: true
        children: {assets: 3, devices: 1}

    InventoryResponse:
      type: object
      properties:
        tenant:
          type: string
        objects:
          type: array
          items:
            $ref: "#/components/schemas/InventoryObject"
        more:
          type: boolean
          description: >-
            Another page exists, from the platform's own page count rather than
            from how many objects came back - a filtered page can be short and
            still not be the last one.

    EstimateRequest:
      type: object
      required: [sourceTenant, rootId]
      description: |
        A migration that has not been asked for yet. The fields are a
        migration's own and are resolved the same way, so what is counted is
        what would move.
      properties:
        sourceTenant:
          type: string
        rootId:
          type: string
        childTypes:
          type: string
          default: asset,device
        noChildren:
          type: boolean
        dataTypes:
          type: string
          description: Omitted counts no records, as a migration without data moves none.
        dateFrom:
          type: string
          description: Omitted uses the configured default, exactly as a run would.
        dateTo:
          type: string
      example:
        sourceTenant: t87654321
        rootId: "1399229"
        dataTypes: measurements

    EstimateResponse:
      type: object
      properties:
        tenant:
          type: string
        rootId:
          type: string
        objects:
          type: integer
        identities:
          type: integer
        credentials:
          type: integer
          description: |
            How many of those objects would be given a device user if the
            migration asked for credentials with `provisionCredentials`.

            Always fewer than `objects`: a group has no device user, and a device
            whose external identities leave no unambiguous choice is skipped
            rather than guessed at. Decided by the same rule the run applies, so
            this cannot disagree with what a migration then does.
        records:
          type: object
          additionalProperties:
            type: integer
          description: The total per kind, for the kinds asked for.
        busiest:
          type: object
          additionalProperties:
            type: integer
          description: |
            The highest single-object count per kind. The limits are per device,
            so a hierarchy well under the total can still be refused.
        window:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EstimateWindow"
          description: The range each kind was counted over, as a run would resolve it.
        breaches:
          type: array
          items:
            $ref: "#/components/schemas/EstimateBreach"
        withinLimits:
          type: boolean
          description: An empty breach list, said plainly, because it is what a caller branches on.
        limits:
          $ref: "#/components/schemas/EstimateLimits"
      example:
        tenant: t87654321
        rootId: "1399229"
        objects: 9
        identities: 4
        records: {measurements: 1204884}
        busiest: {measurements: 218406}
        withinLimits: true
        breaches: []

    EstimateWindow:
      type: object
      properties:
        from:
          type: string
        to:
          type: string

    EstimateBreach:
      type: object
      properties:
        kind:
          type: string
          description: The record kind, or `objects` when the hierarchy itself is too large.
        objectId:
          type: string
          description: The worst offender. Absent for the object count.
        objects:
          type: integer
          description: How many objects breach this limit.
        count:
          type: integer
        allowed:
          type: integer

    EstimateLimits:
      type: object
      description: What the engine enforces, so nobody hardcodes it and drifts.
      properties:
        maxChildObjects:
          type: integer
        perDevice:
          type: object
          additionalProperties:
            type: integer

    MigrationsResponse:
      type: object
      properties:
        migrations:
          type: array
          items:
            $ref: "#/components/schemas/Job"

    RevertsResponse:
      type: object
      properties:
        reverts:
          type: array
          items:
            $ref: "#/components/schemas/Job"

    DeletionResponse:
      type: object
      properties:
        deleted:
          type: array
          description: |
            The ids of the jobs whose records were removed. More than one when a
            migration was deleted together with the undos of it.
          items:
            type: string

    Job:
      type: object
      description: |
        One migration. This is also exactly what the job record in the owner
        tenant holds, under the `c8y_DeviceMigration` fragment of a managed
        object of type `c8y_DeviceMigrationJob`.
      properties:
        id:
          type: string
          description: The job id.
        kind:
          type: string
          enum: [MIGRATION, REVERT]
          description: |
            What the job does. Both kinds go through one queue, so only one of
            either runs at a time. A record written before this field existed is
            read as a migration.
        request:
          $ref: "#/components/schemas/MigrationRequest"
        revert:
          $ref: "#/components/schemas/RevertRequest"
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, INTERRUPTED]
          description: |
            `INTERRUPTED` means the container died while the job was running. The
            job is then over, whatever it had reached.
        runId:
          type: string
          description: |
            Marks everything the run created in the target tenant, and is what an
            undo needs. Present as soon as the engine has announced it, including
            on a job that then failed.
        requestedBy:
          type: string
          description: The tenant and user who asked for this migration.
        rootName:
          type: string
          description: |
            What the migrated object was called when the migration was accepted.
            Recorded because an id identifies the object and describes nothing,
            and because the object may not be there to ask later. Absent when the
            source tenant could not be read at the time, and on records written
            before this field existed.
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
          description: Why the job did not succeed.
        progress:
          type: array
          description: |
            The tail of what the engine printed, up to 200 lines. The whole
            output is in the container log.
          items:
            type: string
        credentialsIssued:
          type: integer
          description: |
            How many devices were given a device user, when the migration asked
            for credentials. A count and never the secrets: this object is
            readable by any administrator of the owner tenant.
        credentialsAvailable:
          type: boolean
          description: |
            Whether those credentials are still waiting to be collected from
            `POST /migrations/{id}/credentials`, **by this caller**.

            Not part of the stored record: it is this service's memory, and it
            becomes false the moment they are collected or the container is
            replaced. It is also false for anyone who did not start the
            migration, who could only be refused by the endpoint - so no screen
            offers a download that cannot work.
        countsVerified:
          type: boolean
          description: |
            Whether the job's own account of itself can be believed. False for a
            cancelled or interrupted run: the engine has no cancellation checks,
            so a run that was cut short miscounts what it did. Check the target
            tenant by run id instead.
      example:
        id: 20260825T162735Z_c8e249
        status: SUCCEEDED
        runId: 20260825T162735Z_b5c5a2
        requestedBy: t10001/admin
        countsVerified: true

    LoggerConfiguration:
      type: object
      properties:
        configuredLevel:
          type: string
          description: The level that was asked for.
        effectiveLevel:
          type: string
          description: The level in force, which for one logger is the same thing.

    LoggersResponse:
      type: object
      properties:
        levels:
          type: array
          items:
            type: string
        loggers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LoggerConfiguration"
        groups:
          type: object
      example:
        levels: [ERROR, WARN, INFO, DEBUG]
        loggers:
          ROOT: {configuredLevel: INFO, effectiveLevel: INFO}
        groups: {}

    Error:
      type: object
      description: |
        The same shape the platform uses for its own errors, so a client that
        understands Cumulocity errors understands these.
      properties:
        error:
          type: string
          description: A short kind, such as `devicemigration/tenantNotSubscribed`.
        message:
          type: string
          description: What went wrong, in a sentence that says what to do about it.
      example:
        error: devicemigration/tenantNotSubscribed
        message: tenant t22222 has no service user for this microservice, so it must be subscribed to it first

  responses:
    BadRequest:
      description: |
        The request cannot be carried out as asked: a missing field, a root id
        that is a path, a source and target that are the same tenant, or a tenant
        that is not subscribed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No credentials, credentials the platform rejected, or credentials naming no tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        A verified caller who may not do this: not a user of the owner tenant, or
        without ROLE_DEVICE_MIGRATION_ADMIN.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No job with this id is on record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        Nothing is wrong with the request; the job's state does not allow it -
        asking to cancel one that has already finished, for instance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Busy:
      description: |
        As many migrations are already queued as this service will hold. One runs
        at a time, so refusing is more honest than accepting.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
