openapi: 3.1.0

info:
  title: Device migration
  version: 0.1.0
  summary: Migrates a device hierarchy from one Cumulocity tenant to another.
  description: |
    The migration engine of the c8y-devicemigration tool, running inside
    Cumulocity as a multi-tenant microservice.

    It is deployed on a parent tenant and subscribed to the tenants it migrates
    between, so the platform provides a service user for each and no session file
    or personal credential is involved.

    Two things shape this API and are worth knowing before reading it:

    - A migration is a job, not a request. The platform caps a request at fifteen
      minutes and a hierarchy with data regularly takes longer, so
      `POST /migrations` answers 202 with a job id and the work continues
      afterwards. One migration runs at a time.
    - Only users of the tenant the microservice is deployed on may migrate, and
      only those holding `ROLE_DEVICE_MIGRATION_ADMIN`. A subtenant administrator
      is refused even with the role: migrating writes into a second tenant, and
      rights in the source say nothing about the target.
  license:
    name: Apache-2.0
  contact:
    name: c8y-devicemigration
    url: https://github.com/Cumulocity-IoT/c8y-devicemigration

servers:
  - url: /service/devicemigration
    description: The microservice as the platform exposes it.

security:
  - basicAuth: []
  - bearerAuth: []
  - cookieAuth: []

tags:
  - name: migrations
    description: Starting, following and stopping migrations.
  - name: tenants
    description: What this microservice can act on.
  - name: monitoring
    description: What the platform's probes and operators use. No credentials needed.
  - name: remote-targets
    description: Certificate connections to tenants this instance is not subscribed to.

paths:
  /health:
    get:
      tags: [monitoring]
      summary: Liveness and readiness
      description: |
        Probed by the platform, which sends no credentials, so this endpoint is
        the one place that answers without them.
      security: []
      operationId: getHealth
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    const: UP
              example: {status: UP}

  /prometheus:
    get:
      tags: [monitoring]
      summary: Metrics
      security: []
      operationId: getMetrics
      responses:
        "200":
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [monitoring]
      summary: This document
      description: |
        The deployed instance's own description, so what a running version
        accepts can be read from it rather than looked up elsewhere.
      security: []
      operationId: getOpenAPI
      responses:
        "200":
          description: This document.
          content:
            application/yaml:
              schema:
                type: string

  /api-json:
    get:
      tags: [monitoring]
      summary: This document, as JSON
      description: |
        The same document as `/openapi.yaml`, converted to JSON.

        This is the path the manifest's `openApiSpec` names, and what the
        platform's API documentation application reads. It fetches with the
        browser's own session, so like the probes it answers without this
        service's own authorization check.
      security: []
      operationId: getOpenAPIJSON
      responses:
        "200":
          description: This document, as JSON.
          content:
            application/json:
              schema:
                type: object
        "500":
          description: The document could not be converted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tenants:
    get:
      tags: [tenants]
      summary: The tenants this microservice can act on
      description: |
        Every tenant currently subscribed to this application, and the tenant the
        microservice is deployed on. A tenant that is not listed cannot be a
        source or a target: subscribe it first.
      operationId: listTenants
      responses:
        "200":
          description: The subscribed tenants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /preflight:
    post:
      tags: [tenants]
      summary: Check that a migration between two tenants is possible
      description: |
        Answers whether this service could migrate between these two tenants,
        without reading or writing a single device - which is why it takes no
        `rootId`.

        It resolves both tenants in the subscription list, refuses a source and
        target that are the same tenant, and then proves each side's service user
        by asking the platform which tenant it belongs to. Run it after
        subscribing a tenant, and before a migration whose credentials have never
        been used.
      operationId: preflight
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreflightRequest"
      responses:
        "200":
          description: Both tenants resolve and both service users work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreflightResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /estimates:
    post:
      tags: [tenants]
      summary: How much a migration would move
      description: |
        Walks the hierarchy and counts what a migration would carry, without
        creating anything. The answer holds the object and identity counts, the
        record counts per kind, the busiest single device per kind - the limits
        are per device, so a hierarchy well under the total can still be refused
        - and whatever limits it would breach.

        The fields are a migration's own, and they are resolved the same way,
        including the configured default window. An estimate therefore describes
        the run that follows it rather than a similar one.

        Synchronous: a hierarchy walk plus one count per object per kind is
        seconds even at the widest the limits allow. It creates nothing, so a
        caller that changes its mind may simply abandon the request.
      operationId: estimate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
      responses:
        "200":
          description: What that migration would move.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstimateResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /tenants/{tenant}/inventory:
    get:
      tags: [tenants]
      summary: Find something to migrate
      description: |
        Reads a subscribed tenant's inventory on the caller's behalf. A browser
        session belongs to one tenant and the hierarchy being migrated is in
        another, so without this there is no way to offer a choice.

        Only devices, groups and assets are offered - the same three fragments
        the platform's own inventory search looks for - so dashboards, smart
        rules and this service's job records are never returned as something to
        migrate.

        `text` matches on name. `onlyRoots` keeps objects that nothing holds as a
        child, which is the top of a hierarchy; it is resolved from the objects'
        parents, so a page of roots is a page of the inventory with the children
        taken out and can hold fewer objects than `pageSize`. Use `more` rather
        than the number of objects to decide whether to ask for another page.
        Reads only.
      operationId: listInventory
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - name: text
          in: query
          description: Match objects whose name contains this.
          schema:
            type: string
        - name: onlyRoots
          in: query
          description: >-
            Keep only objects that are nobody's child. Costs the objects' parents
            on the way, and returns fewer objects than `pageSize`.
          schema:
            type: boolean
        - name: pageSize
          in: query
          description: Objects per page, at most 200.
          schema:
            type: integer
            default: 20
        - name: currentPage
          in: query
          schema:
            type: integer
            default: 1
      responses:
        "200":
          description: A page of objects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /tenants/{tenant}/inventory/{id}:
    get:
      tags: [tenants]
      summary: One object, and what is under it
      description: |
        Confirms a choice, and answers whether an id exists at all — which was
        otherwise discovered when the migration ran, minutes later. Child counts
        come from the platform, so a group holding four hundred devices costs the
        same to look at as one holding two.
      operationId: getInventoryObject
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ObjectID"
      responses:
        "200":
          description: The object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryObject"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /tenants/{tenant}/inventory/{id}/children:
    get:
      tags: [tenants]
      summary: What is directly under one object
      description: |
        The drill-down, over the same three relationship kinds a migration can
        follow and named the same way, so a picker and a migration request speak
        one vocabulary.
      operationId: listInventoryChildren
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ObjectID"
        - name: childTypes
          in: query
          description: |
            Comma separated, from `asset`, `device` and `addition`. Omitted means
            the migration default, `asset,device`.
          schema:
            type: string
            default: asset,device
      responses:
        "200":
          description: The children, each saying which relationship it came from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /tenants/{tenant}/platform/inventory/managedObjects:
    get:
      tags: [tenants]
      summary: The platform's inventory listing, for one tenant
      description: |
        The platform's own `GET /inventory/managedObjects`, performed in a
        subscribed tenant with that tenant's service user, and answered with
        exactly what the platform said — envelope, `statistics` and ordering
        included.

        This exists so the platform's own components can browse a tenant the
        browser has no session in. A Cumulocity client given
        `/service/devicemigration/tenants/{tenant}/platform` as its base URL
        behaves as though it were signed in to that tenant, which is what lets
        the asset selector search, page and expand a group here without any of
        that being reimplemented.

        The whole query string is forwarded, so every filter, page and ordering
        the platform understands works. Reads only, and only the inventory: three
        routes exist and there is no wildcard, so anything else is a 404.
      operationId: proxyInventoryList
      parameters:
        - $ref: "#/components/parameters/TenantID"
      responses:
        "200":
          description: The platform's answer, unchanged apart from its links.
          content:
            application/json:
              schema:
                type: object
                description: >-
                  A Cumulocity managed object collection. Not described further
                  here on purpose: it is the platform's shape, and restating it
                  would be a second definition to keep in step.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /tenants/{tenant}/platform/inventory/managedObjects/{id}:
    get:
      tags: [tenants]
      summary: The platform's managed object read, for one tenant
      description: |
        The platform's own `GET /inventory/managedObjects/{id}` in a subscribed
        tenant. Query parameters are forwarded, so `withParents` and
        `withChildren` behave as they do on the platform.
      operationId: proxyInventoryObject
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ObjectID"
      responses:
        "200":
          description: The platform's answer, unchanged apart from its links.
          content:
            application/json:
              schema:
                type: object
                description: A Cumulocity managed object.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /tenants/{tenant}/platform/inventory/managedObjects/{id}/{relationship}:
    get:
      tags: [tenants]
      summary: One of an object's reference collections, for one tenant
      description: |
        The platform's own reference collections: `childAssets`, `childDevices`,
        `childAdditions`, `assetParents`, `deviceParents` and
        `additionParents`. Expanding a group is one of these reads, which is
        most of what choosing a root consists of.

        Any other value is a 400 rather than a forwarded request, so a path
        parameter cannot become a way to reach the rest of the platform API.
      operationId: proxyInventoryReferences
      parameters:
        - $ref: "#/components/parameters/TenantID"
        - $ref: "#/components/parameters/ObjectID"
        - name: relationship
          in: path
          required: true
          description: Which collection to read.
          schema:
            type: string
            enum:
              - childAssets
              - childDevices
              - childAdditions
              - assetParents
              - deviceParents
              - additionParents
      responses:
        "200":
          description: The platform's answer, unchanged apart from its links.
          content:
            application/json:
              schema:
                type: object
                description: A Cumulocity managed object reference collection.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /remote-targets:
    post:
      tags: [remote-targets]
      summary: Establish a certificate connection to an unsubscribed target
      description: |
        Mints a throwaway certificate authority and a client leaf for a target
        tenant this instance is not subscribed to - a different parent, or a
        different system. Returns the **public** CA to register on that target as
        trusted with auto-registration; the private leaf and key stay in memory
        here and are never returned or recorded. A migration then references the
        returned `id` as `remoteTargetId`.

        Reachable-until-restart: the connection lives in memory, so a container
        restart forgets it and it must be established again.
      operationId: createRemoteTarget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteTargetRequest"
      responses:
        "201":
          description: The connection, with the CA to register.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemoteTargetEstablished"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    get:
      tags: [remote-targets]
      summary: The established remote targets
      description: Without their certificates - the secret material is never listed.
      operationId: listRemoteTargets
      responses:
        "200":
          description: The remote targets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  remoteTargets:
                    type: array
                    items:
                      $ref: "#/components/schemas/RemoteTargetView"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /remote-targets/{id}:
    delete:
      tags: [remote-targets]
      summary: Discard a remote target
      description: Forgets the certificate before it lapses.
      operationId: deleteRemoteTarget
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Discarded.
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /migrations:
    post:
      tags: [migrations]
      summary: Start a migration
      description: |
        Validates the request, records the job in the owner tenant, and queues
        it. Everything that can be checked without touching a tenant is checked
        before this returns, so a bad root id or an unsubscribed tenant is a 400
        rather than a job that fails a minute later.

        Migrations always run incrementally - the export is staged one device's
        data at a time - because that is what bounds the container's ephemeral
        disk. For the same reason there is no way to ignore the export limits or
        to keep the staging directory.
      operationId: createMigration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationRequest"
      responses:
        "202":
          description: |
            Accepted and queued. The body is the job as it was accepted, and the
            Location header points at it.
          headers:
            Location:
              description: Where this job's status can be read.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "429": {$ref: "#/components/responses/Busy"}

    get:
      tags: [migrations]
      summary: Every migration this service has run
      description: |
        Read from the job records in the owner tenant, newest first, so the
        listing survives the container being replaced.
      operationId: listMigrations
      responses:
        "200":
          description: The jobs on record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /migrations/{id}:
    get:
      tags: [migrations]
      summary: One migration
      description: |
        The running job is answered from memory and any other from its record, so
        a running job's progress is as current as the engine's last line rather
        than as its last record update.
      operationId: getMigration
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /migrations/{id}/cancel:
    post:
      tags: [migrations]
      summary: Ask a running migration to stop
      description: |
        The job stops at its next platform call, so this returns before it has.

        A job that is not running here is not an error. Either it finished
        between the screen being drawn and the button being pressed, or its
        container was replaced and the record was left saying `RUNNING` - and in
        the second case this settles that record as `INTERRUPTED` rather than
        refusing. Asking to cancel a job that is already over is a **409**.

        A cancelled job reports `countsVerified: false`, and that is not a
        formality: the engine has no cancellation checks, so a cancelled import
        counts the records it never sent as failures. Check the target tenant by
        run id before retrying.
      operationId: cancelMigration
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: |
            The cancellation has been asked for. Also the answer when the job was
            not running here after all and its record has been settled instead -
            see the description above.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /reverts:
    post:
      tags: [migrations]
      summary: Undo what a migration created
      description: |
        Deletes the objects a run created in the tenant it migrated into.

        A run id is all this needs: every object a migration creates carries a
        marker fragment naming the run, so the engine finds them by asking the
        target tenant rather than by reading a mapping file. Nothing has to have
        survived on disk, which is what makes undoing a run possible from a
        container that has been replaced since.

        `jobId` is the same thing spelled more conveniently - the run id and the
        tenant are both on that job's record. A migration run with `noFlag` has
        no marker and therefore cannot be undone this way; the refusal says so.

        Like a migration this is a job, and it shares the same queue, so a revert
        never runs while a migration is part way through creating what it would
        be deleting.
      operationId: createRevert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequest"
      responses:
        "202":
          description: Accepted and queued.
          headers:
            Location:
              description: Where this job's status can be read.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "429": {$ref: "#/components/responses/Busy"}

    get:
      tags: [migrations]
      summary: Every revert this service has run
      operationId: listReverts
      responses:
        "200":
          description: The reverts on record, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevertsResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /reverts/{id}:
    get:
      tags: [migrations]
      summary: One revert
      operationId: getRevert
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "200":
          description: The job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

  /reverts/{id}/cancel:
    post:
      tags: [migrations]
      summary: Ask a running revert to stop
      description: |
        A cancelled revert reports `countsVerified: false`, and here that matters
        more than anywhere else: the engine decides an object is gone by whether
        re-reading it fails, so a cancelled run reports objects as deleted that
        are still there. Run the revert again rather than trusting its numbers -
        deleting what is already gone is reported as absent and costs nothing.
      operationId: cancelRevert
      parameters:
        - $ref: "#/components/parameters/JobID"
      responses:
        "202":
          description: |
            The cancellation has been asked for, or the job's record has been
            settled - see cancelMigration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  message:
                    type: string
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}

  /loggers:
    get:
      tags: [monitoring]
      summary: The log level in force
      description: |
        The Spring Boot actuator shape the platform proxies at
        `/service/{name}/loggers`, so `c8y microservices loggers` works against
        this service.

        Go's structured logging has no logger hierarchy to expose, so there is one
        logger, named `ROOT` as the actuator names its own. Anything else is a
        404 rather than a pretence that it was configured.
      operationId: listLoggers
      responses:
        "200":
          description: The levels available and the logger there is.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggersResponse"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}

  /loggers/{name}:
    get:
      tags: [monitoring]
      summary: One logger
      operationId: getLogger
      parameters:
        - $ref: "#/components/parameters/LoggerName"
      responses:
        "200":
          description: That logger's level.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoggerConfiguration"
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

    post:
      tags: [monitoring]
      summary: Change the log level while the service runs
      description: |
        Turning debug output on without redeploying, which otherwise means losing
        whatever was running. A `configuredLevel` of `null`, or an absent one,
        resets to the default - which is what `c8y microservices loggers delete`
        sends.
      operationId: setLogger
      parameters:
        - $ref: "#/components/parameters/LoggerName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                configuredLevel:
                  type: [string, "null"]
                  enum: [ERROR, WARN, INFO, DEBUG, TRACE, null]
                  description: |
                    TRACE is accepted and treated as DEBUG, which is the finest
                    level Go's logging has.
              example: {configuredLevel: DEBUG}
      responses:
        "204":
          description: The level was changed.
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Credentials must name their tenant, as `tenant/username`. Basic auth
        without a tenant is ambiguous and is refused rather than assumed to mean
        the owner tenant.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The tenant is taken from the token's `ten` claim.
    cookieAuth:
      type: apiKey
      in: cookie
      name: authorization
      description: |
        A browser session, which is what the API documentation application's
        "Try it out" uses. The cookie holds the session token, and the tenant
        comes from its `ten` claim.

        Anything other than a read must also carry the `X-XSRF-TOKEN` header,
        matching the session. A cookie travels with any request a browser can be
        talked into making, so without that header a page visited while logged in
        could start a migration; reads need no such proof. A session with
        two-factor authentication must also send its `tfatoken` header, which is
        forwarded when the caller is verified.

  parameters:
    TenantID:
      name: tenant
      in: path
      required: true
      description: A tenant subscribed to this microservice.
      schema:
        type: string
      example: t11106993

    ObjectID:
      name: id
      in: path
      required: true
      description: A managed object id. An id, not a path.
      schema:
        type: string
      example: "1399229"

    LoggerName:
      name: name
      in: path
      required: true
      description: The logger, of which there is one - `ROOT`.
      schema:
        type: string
      example: ROOT

    JobID:
      name: id
      in: path
      required: true
      description: The job id, as returned when the migration was accepted.
      schema:
        type: string
      example: 20260825T162735Z_c8e249

  schemas:
    TenantsResponse:
      type: object
      properties:
        ownerTenant:
          type: string
          description: |
            The tenant the microservice is deployed on. Job records are written
            here, and only its users may migrate.
        tenants:
          type: array
          description: Every tenant subscribed to this application.
          items:
            $ref: "#/components/schemas/TenantDescription"
      example:
        ownerTenant: t10001
        tenants:
          - {id: t10001, name: Operations, domain: t10001.eu-latest.cumulocity.com}
          - {id: t11111, name: Werk Berlin, domain: t11111.eu-latest.cumulocity.com}

    TenantDescription:
      type: object
      description: |
        A tenant as a person would recognise it. The id is what every other
        endpoint takes; the name and the host are what somebody choosing between
        two tenants reads.

        They come from two places, because the platform keeps them in two: the
        name is the company in tenant management, which only the owner tenant can
        read and only with `ROLE_TENANT_MANAGEMENT_READ`; the host is from each
        tenant's own `currentTenant`, which its service user can always read.
        Either can be absent - a tenant that cannot be described is still listed
        with its id, because that is what a migration needs.
      properties:
        id:
          type: string
        name:
          type: string
          description: The company name, from tenant management.
        domain:
          type: string
          description: The host this tenant is reached at.

    RemoteTargetRequest:
      type: object
      required: [host, tenant]
      properties:
        host:
          type: string
          description: Where the target lives, e.g. t12345.eu-latest.cumulocity.com. Https assumed.
        tenant:
          type: string
          description: The target tenant id, used to reject a same-tenant migration and shown on the job.
      example:
        host: t22222.eu-latest.cumulocity.com
        tenant: t22222

    RemoteTargetView:
      type: object
      description: A remote target without its certificate.
      properties:
        id:
          type: string
        host:
          type: string
        tenant:
          type: string
        subject:
          type: string
          description: The common name of the leaf, which the target auto-registers as a device.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    RemoteTargetEstablished:
      type: object
      description: A newly established remote target and the CA to register on it.
      properties:
        id:
          type: string
        host:
          type: string
        tenant:
          type: string
        subject:
          type: string
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        caCertificate:
          type: string
          description: The public CA certificate to register as trusted on the target.
        instructions:
          type: string
          description: What to do with the CA, in words.

    PreflightRequest:
      type: object
      required: [sourceTenant]
      description: |
        Give exactly one of `targetTenant` (a subscribed tenant) or
        `remoteTargetId` (a target established with `POST /remote-targets`).
      properties:
        sourceTenant:
          type: string
          description: The tenant a migration would read from.
        targetTenant:
          type: string
          description: A subscribed tenant a migration would write to. Must not be the source.
        remoteTargetId:
          type: string
          description: |
            A remote target established with `POST /remote-targets`, for a tenant
            this instance is not subscribed to.
      example:
        sourceTenant: t11111
        targetTenant: t22222

    PreflightResponse:
      type: object
      properties:
        host:
          type: string
          description: The platform both tenants live on.
        source:
          $ref: "#/components/schemas/PreflightSide"
        target:
          $ref: "#/components/schemas/PreflightSide"

    PreflightSide:
      type: object
      properties:
        tenant:
          type: string
          description: The tenant that was asked for.
        reportedTenant:
          type: string
          description: |
            The tenant the platform says the service user belongs to. Proof that
            the credentials work, rather than that they exist.
        serviceUser:
          type: string
          description: The service user this microservice acts as in that tenant.

    MigrationRequest:
      type: object
      required: [sourceTenant, rootId]
      description: |
        The fields are the command line tool's flags, resolved by the same code,
        so values mean here exactly what they mean there. An unknown field is
        refused rather than ignored, so a typo is a 400.

        The target is given as exactly one of `targetTenant` (a subscribed
        tenant) or `remoteTargetId` (a target this instance is not subscribed to,
        established with `POST /remote-targets`).
      properties:
        sourceTenant:
          type: string
          description: The tenant to read from. Must be subscribed to this application.
        targetTenant:
          type: string
          description: A subscribed tenant to write to. Must not be the source.
        remoteTargetId:
          type: string
          description: |
            A remote target established with `POST /remote-targets`. When given,
            `targetTenant` is filled in from it and need not be sent.
        rootId:
          type: string
          description: |
            The id of the root managed object to migrate. An id, not a path: a
            value containing a path separator is refused, because it would end up
            in the names of the files the export writes.
        childTypes:
          type: string
          description: |
            Comma separated child relationship types to follow, from `asset`,
            `device` and `addition`. Omitted means the default.
          default: asset,device
        noChildren:
          type: boolean
          description: Migrate only the root object. Cannot be combined with childTypes.
          default: false
        dataTypes:
          type: string
          description: |
            Comma separated device data to include, from `measurements`, `events`
            and `alarms`, or `all` for every one of them. Omitted means no data.
            `all` cannot be combined with named types.
        dateFrom:
          type: string
          description: |
            Start of the data window, absolute or relative (`-30d`). Measurements
            default to the last 14 days; events and alarms to everything.
        dateTo:
          type: string
          description: End of the data window.
        noFlag:
          type: boolean
          description: |
            Leave created objects unmarked. The marker fragment is what makes a
            run findable by its run id, so without it the job's mapping is the
            only record of what was created - and that mapping does not outlive
            the container.
          default: false
      example:
        sourceTenant: t11111
        targetTenant: t22222
        rootId: "1399229"
        dataTypes: all
        dateFrom: -30d

    RevertRequest:
      type: object
      description: |
        Either a run id with the tenant to undo it in, or the id of the job that
        created it - in which case both are read from that job's record.
      properties:
        targetTenant:
          type: string
          description: |
            The tenant holding what should be deleted. Required unless jobId
            says which tenant it was.
        runId:
          type: string
          description: |
            The run whose objects should be deleted. Required unless jobId is
            given; if both are given they must agree.
        jobId:
          type: string
          description: The migration to undo, which is where the run id comes from.
      example:
        jobId: 20260825T162735Z_c8e249

    InventoryObject:
      type: object
      description: As much of a managed object as choosing a root needs.
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        owner:
          type: string
        creationTime:
          type: string
        isDevice:
          type: boolean
          description: Carries the platform's device marker.
        isGroup:
          type: boolean
          description: Carries the platform's group marker.
        children:
          type: object
          additionalProperties:
            type: integer
          description: |
            How many children per relationship kind. Present only where the
            platform was asked to count them, which the single-object read does.
            An absent count is not zero.
        childType:
          type: string
          enum: [asset, device, addition]
          description: The relationship this object was reached by, when it was reached as a child.
      example:
        id: "1399229"
        name: Plant Berlin
        type: c8y_Site
        isDevice: false
        isGroup: true
        children: {assets: 3, devices: 1}

    InventoryResponse:
      type: object
      properties:
        tenant:
          type: string
        objects:
          type: array
          items:
            $ref: "#/components/schemas/InventoryObject"
        more:
          type: boolean
          description: >-
            Another page exists, from the platform's own page count rather than
            from how many objects came back - a filtered page can be short and
            still not be the last one.

    EstimateRequest:
      type: object
      required: [sourceTenant, rootId]
      description: |
        A migration that has not been asked for yet. The fields are a
        migration's own and are resolved the same way, so what is counted is
        what would move.
      properties:
        sourceTenant:
          type: string
        rootId:
          type: string
        childTypes:
          type: string
          default: asset,device
        noChildren:
          type: boolean
        dataTypes:
          type: string
          description: Omitted counts no records, as a migration without data moves none.
        dateFrom:
          type: string
          description: Omitted uses the configured default, exactly as a run would.
        dateTo:
          type: string
      example:
        sourceTenant: t11106993
        rootId: "1399229"
        dataTypes: measurements

    EstimateResponse:
      type: object
      properties:
        tenant:
          type: string
        rootId:
          type: string
        objects:
          type: integer
        identities:
          type: integer
        records:
          type: object
          additionalProperties:
            type: integer
          description: The total per kind, for the kinds asked for.
        busiest:
          type: object
          additionalProperties:
            type: integer
          description: |
            The highest single-object count per kind. The limits are per device,
            so a hierarchy well under the total can still be refused.
        window:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/EstimateWindow"
          description: The range each kind was counted over, as a run would resolve it.
        breaches:
          type: array
          items:
            $ref: "#/components/schemas/EstimateBreach"
        withinLimits:
          type: boolean
          description: An empty breach list, said plainly, because it is what a caller branches on.
        limits:
          $ref: "#/components/schemas/EstimateLimits"
      example:
        tenant: t11106993
        rootId: "1399229"
        objects: 9
        identities: 4
        records: {measurements: 1204884}
        busiest: {measurements: 218406}
        withinLimits: true
        breaches: []

    EstimateWindow:
      type: object
      properties:
        from:
          type: string
        to:
          type: string

    EstimateBreach:
      type: object
      properties:
        kind:
          type: string
          description: The record kind, or `objects` when the hierarchy itself is too large.
        objectId:
          type: string
          description: The worst offender. Absent for the object count.
        objects:
          type: integer
          description: How many objects breach this limit.
        count:
          type: integer
        allowed:
          type: integer

    EstimateLimits:
      type: object
      description: What the engine enforces, so nobody hardcodes it and drifts.
      properties:
        maxChildObjects:
          type: integer
        perDevice:
          type: object
          additionalProperties:
            type: integer

    MigrationsResponse:
      type: object
      properties:
        migrations:
          type: array
          items:
            $ref: "#/components/schemas/Job"

    RevertsResponse:
      type: object
      properties:
        reverts:
          type: array
          items:
            $ref: "#/components/schemas/Job"

    Job:
      type: object
      description: |
        One migration. This is also exactly what the job record in the owner
        tenant holds, under the `c8y_DeviceMigration` fragment of a managed
        object of type `c8y_DeviceMigrationJob`.
      properties:
        id:
          type: string
          description: The job id.
        kind:
          type: string
          enum: [MIGRATION, REVERT]
          description: |
            What the job does. Both kinds go through one queue, so only one of
            either runs at a time. A record written before this field existed is
            read as a migration.
        request:
          $ref: "#/components/schemas/MigrationRequest"
        revert:
          $ref: "#/components/schemas/RevertRequest"
        status:
          type: string
          enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, INTERRUPTED]
          description: |
            `INTERRUPTED` means the container died while the job was running. The
            job is then over, whatever it had reached.
        runId:
          type: string
          description: |
            Marks everything the run created in the target tenant, and is what an
            undo needs. Present as soon as the engine has announced it, including
            on a job that then failed.
        requestedBy:
          type: string
          description: The tenant and user who asked for this migration.
        rootName:
          type: string
          description: |
            What the migrated object was called when the migration was accepted.
            Recorded because an id identifies the object and describes nothing,
            and because the object may not be there to ask later. Absent when the
            source tenant could not be read at the time, and on records written
            before this field existed.
        queuedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          type: string
          description: Why the job did not succeed.
        progress:
          type: array
          description: |
            The tail of what the engine printed, up to 200 lines. The whole
            output is in the container log.
          items:
            type: string
        countsVerified:
          type: boolean
          description: |
            Whether the job's own account of itself can be believed. False for a
            cancelled or interrupted run: the engine has no cancellation checks,
            so a run that was cut short miscounts what it did. Check the target
            tenant by run id instead.
      example:
        id: 20260825T162735Z_c8e249
        status: SUCCEEDED
        runId: 20260825T162735Z_b5c5a2
        requestedBy: t10001/admin
        countsVerified: true

    LoggerConfiguration:
      type: object
      properties:
        configuredLevel:
          type: string
          description: The level that was asked for.
        effectiveLevel:
          type: string
          description: The level in force, which for one logger is the same thing.

    LoggersResponse:
      type: object
      properties:
        levels:
          type: array
          items:
            type: string
        loggers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/LoggerConfiguration"
        groups:
          type: object
      example:
        levels: [ERROR, WARN, INFO, DEBUG]
        loggers:
          ROOT: {configuredLevel: INFO, effectiveLevel: INFO}
        groups: {}

    Error:
      type: object
      description: |
        The same shape the platform uses for its own errors, so a client that
        understands Cumulocity errors understands these.
      properties:
        error:
          type: string
          description: A short kind, such as `devicemigration/tenantNotSubscribed`.
        message:
          type: string
          description: What went wrong, in a sentence that says what to do about it.
      example:
        error: devicemigration/tenantNotSubscribed
        message: tenant t22222 has no service user for this microservice, so it must be subscribed to it first

  responses:
    BadRequest:
      description: |
        The request cannot be carried out as asked: a missing field, a root id
        that is a path, a source and target that are the same tenant, or a tenant
        that is not subscribed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No credentials, credentials the platform rejected, or credentials naming no tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: |
        A verified caller who may not do this: not a user of the owner tenant, or
        without ROLE_DEVICE_MIGRATION_ADMIN.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No job with this id is on record.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        Nothing is wrong with the request; the job's state does not allow it -
        asking to cancel one that has already finished, for instance.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Busy:
      description: |
        As many migrations are already queued as this service will hold. One runs
        at a time, so refusing is more honest than accepting.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
